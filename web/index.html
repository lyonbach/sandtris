<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sandtris</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; background: #111; }
        body { display: grid; place-items: center; overflow: hidden; }
        canvas {
            display: block;
            width: 100vw;
            height: 100dvh;
            max-width: 100vw;
            max-height: 100dvh;
            object-fit: contain;
            touch-action: none;
            user-select: none;
        }
    </style>
</head>
    <body style="display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; margin: 0; overflow: hidden; background: #111;">
        <canvas id="glcanvas" tabindex="1"></canvas>
        <script src="mq_js_bundle.js"></script>
        <script>
            window.addEventListener('load', () => {
                const canvas = document.getElementById('glcanvas');
                if (canvas) {
                    if (typeof load === 'function') {
                        load('dustris.wasm');
                    } else {
                        console.error('load function not found');
                    }
                } else {
                    console.error('Canvas element not found');
                }
            });
        </script>
    </body>
</html>
