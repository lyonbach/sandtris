name: Build Android debug APK

on:
  push:
    branches: [mobile-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android export
        env:
          HOME: /github/home
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl --fail --location --silent --show-error --output /tmp/android-command-line-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"
          unzip -q /tmp/android-command-line-tools.zip -d /tmp/android-command-line-tools
          mv /tmp/android-command-line-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
          mkdir -p "$HOME/.android" "$HOME/.config/godot" "$HOME/.local/share/godot"
          cp -R /root/.local/share/godot/templates "$HOME/.local/share/godot/"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-3.tres" <<EOF
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export Android debug APK
        env:
          HOME: /github/home
        run: |
          mkdir -p build/android
          godot --path . --export-debug "Android Debug" build/android/sandtris-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sandtris-debug-apk
          path: build/android/sandtris-debug.apk
          if-no-files-found: error
